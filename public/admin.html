<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenAura Dental – Booking requests</title>
<style>
  :root { --ink:#1d2a33; --muted:#5d6b75; --line:#e2e6e9; --bg:#f6f7f8; --card:#fff;
          --teal:#0f5c63; --amber:#a15c00; --amber-bg:#fff3e0; --green:#1b6b3a; --green-bg:#e6f4ea;
          --red:#a12b2b; --red-bg:#fbeaea; --grey-bg:#eef0f2; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--teal); color:#fff; padding:16px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header .meta { opacity:.85; font-size:13px; }
  header .spacer { flex:1; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:#b9c1c7; }
  button.ok { border-color:#9fd0b0; color:var(--green); }
  button.no { border-color:#e7b4b4; color:var(--red); }
  header button { background:transparent; color:#fff; border-color:rgba(255,255,255,.5); }
  main { padding:20px 24px; max-width:1200px; margin:0 auto; }
  .filters { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:860px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:#fafbfb; }
  tr:last-child td { border-bottom:0; }
  tr.fresh { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background:#fff8d6; } to { background:transparent; } }
  .ref { font-weight:600; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .sub { color:var(--muted); font-size:12px; }
  .pill { display:inline-block; border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; }
  .requested { background:var(--amber-bg); color:var(--amber); }
  .confirmed { background:var(--green-bg); color:var(--green); }
  .rejected, .cancelled { background:var(--red-bg); color:var(--red); }
  .tag { display:inline-block; margin-left:6px; background:var(--grey-bg); color:var(--muted); border-radius:4px; padding:1px 6px; font-size:11px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>ZenAura Dental – Booking requests</h1>
  <span class="meta" id="meta">Loading…</span>
  <span class="spacer"></span>
  <button id="reset" title="Delete all bookings (for a fresh demo)">Clear all bookings</button>
</header>
<main>
  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="requested">Pending</button>
    <button data-f="confirmed">Confirmed</button>
    <button data-f="cancelled">Cancelled / declined</button>
  </div>
  <div class="wrap">
    <table>
      <thead><tr><th>Reference</th><th>Status</th><th>Appointment</th><th>Clinic &amp; dentist</th><th>Patient</th><th>Source</th><th>Actions</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
  let filter = 'all';
  let known = new Set();
  let first = true;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  async function load() {
    try {
      const r = await fetch('/admin/api/bookings', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      render(data.bookings);
      document.getElementById('meta').textContent = `${data.count} requests · updated ${new Date().toLocaleTimeString()}`;
    } catch (e) {
      document.getElementById('meta').textContent = 'Could not load bookings, retrying…';
    }
  }

  function render(list) {
    const shown = list.filter((b) => filter === 'all' || b.status === filter || (filter === 'cancelled' && (b.status === 'cancelled' || b.status === 'rejected')));
    const tbody = document.getElementById('rows');
    if (!shown.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">No booking requests yet.</td></tr>'; }
    else {
      tbody.innerHTML = shown.map((b) => {
        const fresh = !first && !known.has(b.ref + b.updatedAt);
        const live = b.status === 'requested' || b.status === 'confirmed';
        return `<tr class="${fresh ? 'fresh' : ''}">
          <td><span class="ref">${esc(b.ref)}</span>${b.rescheduleCount ? '<span class="tag">Rescheduled</span>' : ''}<div class="sub">${esc(new Date(b.createdAt).toLocaleString())}</div></td>
          <td><span class="pill ${esc(b.status)}">${esc(b.statusLabel)}</span></td>
          <td>${esc(b.dateLabel)}<div class="sub">${esc(b.timeLabel)} · ${esc(b.service.name)}</div></td>
          <td>${esc(b.clinic.name)}<div class="sub">${esc(b.dentist)}</div></td>
          <td>${esc(b.patient.name)}<div class="sub">${esc(b.patient.mobile)}${b.patient.email ? ' · ' + esc(b.patient.email) : ''}</div></td>
          <td>${esc(b.channel || '–')}<div class="sub">${esc(b.conversationId || '')}</div></td>
          <td><div class="actions">${b.status === 'requested' ? `<button class="ok" data-a="confirm" data-r="${esc(b.ref)}">Confirm</button><button class="no" data-a="reject" data-r="${esc(b.ref)}">Decline</button>` : ''}${live ? `<button data-a="cancel" data-r="${esc(b.ref)}">Cancel</button>` : ''}</div></td>
        </tr>`;
      }).join('');
    }
    known = new Set(list.map((b) => b.ref + b.updatedAt));
    first = false;
  }

  document.getElementById('rows').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-a]');
    if (!btn) return;
    btn.disabled = true;
    await fetch(`/admin/api/bookings/${encodeURIComponent(btn.dataset.r)}/${btn.dataset.a}`, { method: 'POST' });
    load();
  });
  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-f]');
    if (!btn) return;
    filter = btn.dataset.f;
    document.querySelectorAll('#filters button').forEach((b) => b.classList.toggle('on', b === btn));
    load();
  });
  document.getElementById('reset').addEventListener('click', async () => {
    const btn = document.getElementById('reset');
    if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = 'Click again to delete all'; setTimeout(() => { btn.dataset.armed = ''; btn.textContent = 'Clear all bookings'; }, 4000); return; }
    btn.dataset.armed = ''; btn.textContent = 'Clear all bookings';
    await fetch('/admin/api/reset', { method: 'POST' });
    load();
  });

  load();
  setInterval(load, 4000);
</script>
</body>
</html>
